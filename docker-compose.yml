# Local development stack. Every secret comes from a .env file next to this
# file (copy .env.example to .env). Nothing here is production configuration.
#
# TLS: the backend refuses to start in production without sslmode=require on
# DATABASE_URL and a rediss:// REDIS_URL. This compose file runs Postgres and
# Redis without TLS on a private network, so the backend runs with
# NODE_ENV=development here. For production use managed TLS Postgres/Redis, or
# mount server certificates and start postgres with
# "-c ssl=on -c ssl_cert_file=... -c ssl_key_file=..." and redis with
# "--tls-port 6379 --port 0 --tls-cert-file ... --tls-key-file ... --tls-ca-cert-file ...".
#
# This file has not been run in the authoring sandbox (no Docker daemon).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-laundrymap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # The Dockerfile sets NODE_ENV=production; override because local Postgres/Redis are not TLS.
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-laundrymap}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OTP_ENCRYPTION_KEY: ${OTP_ENCRYPTION_KEY:?set OTP_ENCRYPTION_KEY in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-http://localhost:3000}
      SEED_DEMO: ${SEED_DEMO:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks: [internal]

  # Development-mode frontend (next dev). The production frontend deploys to Vercel.
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev --workspace=frontend"
    environment:
      API_PROXY_TARGET: http://backend:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
